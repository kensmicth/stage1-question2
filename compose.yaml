services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory-dev-password
      CACHE_STORE: database
      SESSION_DRIVER: database
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./.env:/var/www/html/.env
    command: sh -c "php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory-dev-password
      MYSQL_ROOT_PASSWORD: root-dev-password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-dev-password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data: